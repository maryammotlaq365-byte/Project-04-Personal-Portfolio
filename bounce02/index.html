<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1 id="title">My Portfolio</h1>

        <button id="languageButton">العربية</button>
    </header>

    <main>
        <section>
            <h2 id="welcome">Welcome to my portfolio</h2>

            <p id="description">
                I am a cybersecurity enthusiast interested in technology and security.
            </p>
        </section>

        <section>
            <h2 id="aboutTitle">About Me</h2>

            <p id="aboutText">
                I enjoy learning cybersecurity, networking, and web technologies.
            </p>
        </section>

        <section>
            <h2 id="skillsTitle">My Skills</h2>

            <div class="skills">
                <div class="card" id="skill1">Cybersecurity</div>
                <div class="card" id="skill2">Networking</div>
                <div class="card" id="skill3">Web Development</div>
            </div>
        </section>
    </main>

    <footer>
        <p id="footerText">Thank you for visiting my portfolio.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
